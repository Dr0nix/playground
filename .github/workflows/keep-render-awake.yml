name: Keep Render Awake

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call Render keep-alive endpoint with retries
        run: |
          curl --fail --silent --show-error \
            --connect-timeout 15 \
            --max-time 60 \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            https://playgrownd.onrender.com/system/awake > /dev/null