<!-- 문서 골격 없이 fragment 요소만 -->
<aside th:fragment="sidebar" class="sb">
    <link rel="stylesheet" th:href="@{/css/app.css}"/>

    <div class="brand">
        <a th:href="@{/gotopage/{no}(no=6)}" aria-label="홈으로">
            <img id="logo" th:src="@{/img/horizontal_logo.png}" alt="logo" style="display:block;"/>
        </a>
    </div>

    <!-- 최상위 그룹 반복 -->
    <div th:each="grp : ${menuTree}">
        <div class="title"
             role="button"
             th:attr="aria-controls=${'m-'+grp.id},aria-expanded=${true}"
             th:text="${grp.name}">Group</div>

        <ul class="menu-list" th:id="${'m-'+grp.id}">
            <!-- 자식이 페이지(P)인 경우 -->
            <li th:each="child : ${grp.children}" th:if="${child.page}">
                <a th:href="@{/gotopage/{no}(no=${child.id})}"
                   th:text="${child.name}">메뉴</a>
            </li>

            <!-- 자식이 그룹(GR)인 경우 (한 단계 더) -->
            <li th:each="sub : ${grp.children}" th:if="${sub.group}">
                <div class="title"
                     role="button"
                     th:attr="aria-controls=${'m-'+sub.id},aria-expanded=${false}"
                     th:text="${sub.name}">Sub Group</div>

                <ul class="menu-list is-collapsed" th:id="${'m-'+sub.id}">
                    <li th:each="p : ${sub.children}">
                        <a th:href="@{/gotopage/{no}(no=${p.id})}"
                           th:text="${p.name}">item</a>
                    </li>
                </ul>
            </li>
        </ul>
    </div>

    <!-- 접었다/폈다 스크립트 (접근성 포함) -->
    <script>
        (function(){
            const root = document.currentScript.closest('.sb');
            root.querySelectorAll('.title[role="button"]').forEach(title=>{
                const id = title.getAttribute('aria-controls');
                const list = id ? document.getElementById(id) : title.nextElementSibling;
                const open = title.getAttribute('aria-expanded') !== 'false';
                if (list) list.classList.toggle('is-collapsed', !open);

                const toggle = ()=>{
                    const nowOpen = title.getAttribute('aria-expanded') === 'true';
                    title.setAttribute('aria-expanded', String(!nowOpen));
                    if (list) list.classList.toggle('is-collapsed', nowOpen);
                };
                title.addEventListener('click', toggle);
                title.addEventListener('keydown', e=>{
                    if(e.key==='Enter' || e.key===' ') { e.preventDefault(); toggle(); }
                });
            });
        })();
    </script>
</aside>
