<!-- templates/login.html -->
<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>로그인</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="wrap">
    <div class="card">

        <!-- 브랜드 -->
        <div class="brand">
            <img id="logo" src="../../img/horizontal_logo.png" alt="logo">
        </div>

        <!-- 로그인 폼 -->
        <form>
            <div class="field">
                <label class="label" for="username">아이디</label>
                <input class="input" id="username" name="username" type="text" placeholder="아이디 입력" required autofocus />
            </div>

            <div class="field">
                <label class="label" for="password">비밀번호</label>
                <input class="input" id="password" name="password" type="password" placeholder="비밀번호 입력" required />
            </div>

            <div class="actions">
                <button class="btn" type="submit" id="submitBtn">로그인</button>
                <a class="btn secondary" th:href="@{/signup}" role="button">회원가입</a>
            </div>
        </form>

        <div class="foot">© 2025 PLAYGROWN`D</div>
    </div>
</div>
</body>
</html>
