<!-- templates/login.html -->
<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>로그인</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="wrap">
    <div class="card">

        <!-- 브랜드 -->
        <div class="brand">
            <img id="logo" src="../../img/horizontal_logo.png" alt="logo">
        </div>

        <!-- 로그인 폼 -->
        <form  th:action="@{/login}" method="post">
            <div class="field">
                <label class="label" for="userEmail">이메일</label>
                <input class="input" id="userEmail" name="userEmail" type="text" placeholder="이메일 입력" required autofocus />
            </div>

            <div class="field">
                <label class="label" for="userPw">비밀번호</label>
                <input class="input" id="userPw" name="userPw" type="password" placeholder="비밀번호 입력" required />
            </div>

            <div class="actions">
                <button class="btn primary" type="submit" id="submitBtn">로그인</button>
                <a href="/signup-page" class="btn secondary">회원가입</a>
            </div>
        </form>

        <div class="foot">© 2025 PLAYGROWN`D</div>
    </div>
</div>

<script th:if="${param.error}">
    alert('로그인에 실패했습니다. 이메일/비밀번호를 확인해 주세요.');
</script>
</body>
</html>
