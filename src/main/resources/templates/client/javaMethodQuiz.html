<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base}">

<head>
    <meta charset="utf-8">
    <title>퀴즈</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>
        .hidden{display:none !important;}
        .stage{
            min-height:calc(100vh - 56px);
            display:grid;
            place-items:center;
            position:relative;
            padding:28px;
        }
        .card--intro{
            max-width:720px;
            width:min(92vw, 720px);
            margin:0;
            padding:64px 48px;
            text-align:center;
            border:2px solid var(--accent);
            border-radius:16px;
            background:var(--panel);
            box-shadow:0 16px 28px rgba(124,58,237,.07);
        }
        .intro-title{
            font-size:22px; line-height:1.6; margin-bottom:28px; font-weight:700;
        }
        .intro-actions{ display:grid; place-items:center; }
        .intro-actions .btn{ width:240px; height:56px; font-size:18px; }

        .score-badge{
            position:absolute; right:12px; top:12px;
            padding:10px 18px; border:2px solid var(--accent);
            border-radius:10px; background:var(--panel); color:var(--text);
            font-weight:800; box-shadow:0 6px 16px rgba(124,58,237,.08);
        }

        .quiz-panel{
            width:min(560px, 92vw);
            display:grid;
            gap:24px;
            justify-items:center;
        }

        .question{
            width:100%;
            border:2px solid var(--accent);
            border-radius:12px;
            background:var(--panel);
            padding:38px 26px;
            text-align:center;
            box-shadow:0 14px 28px rgba(124,58,237,.07);
            font-size:18px;
            margin:0;
        }
        .q-meta{ font-size:13px; color:var(--muted); margin-bottom:10px }

        .answer{
            width:100%;
            display:grid;
            grid-template-columns:1fr 120px;
            gap:12px;
            align-items:center;
            margin:0;
        }
        .answer .input{ height:52px; font-size:16px; border-width:2px; }
        .answer .btn.primary{ height:52px; font-size:16px; }

        .toolbar{
            width:100%;
            display:flex;
            gap:8px;
            justify-content:flex-end;
            margin:0;
        }
        .toolbar .btn{ width:auto; padding:10px 14px }

        @media (max-width:640px){
            .answer{ grid-template-columns:1fr }
        }
    </style>
</head>

<body>
<section class="main" layout:fragment="content">

    <div class="stage" id="introStage">
        <div id="intro" class="card card--intro">
            <div class="intro-title">
                문제에서 설명하는 <strong>자바 메서드</strong>를<br/>
                <strong>단답으로 입력</strong>하세요
            </div>
            <div class="intro-actions">
                <button id="startBtn" class="btn primary" type="button">시작</button>
            </div>
        </div>
    </div>

    <div class="stage hidden" id="quizStage">
        <div class="score-badge">점수 <span id="score">0</span></div>

        <div class="quiz-panel">
            <div class="question">
                <div class="q-meta"><span id="qNo">1</span> / <span id="qTotal">10</span></div>
                <div id="qText">아래 설명에 해당하는 자바 메서드명을 단답으로 입력하세요.</div>
            </div>

            <div class="answer">
                <input id="answer" class="input" type="text" placeholder="답 입력 (예: toString)" autocomplete="off">
                <button id="submit" class="btn primary" type="button">제출</button>
            </div>

            <div class="toolbar">
                <button id="hint" class="btn secondary" type="button">힌트</button>
                <button id="skip" class="btn secondary" type="button">건너뛰기</button>
            </div>
        </div>
    </div>

</section>

<th:block layout:fragment="script">
    <script th:src="@{/js/common/utils.js}"></script>
    <script th:src="@{/js/client/javaMethodQuiz.js}"></script>
</th:block>
</body>
</html>
