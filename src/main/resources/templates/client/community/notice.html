<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base}">

<head>
    <meta charset="utf-8">
    <title>공지사항</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/community/notice.css}">
    <!-- Toast UI Editor -->
    <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css">
</head>

<body>
<section class="main" layout:fragment="content">

    <!-- 로그인 유저 정보 (JS에서 admin 판별용) -->
    <input type="hidden" id="loginUserId"
           th:value="${loginUser != null ? loginUser.userId : ''}">

    <div class="notice-page">

        <!-- ============ 목록 화면 ============ -->
        <div id="listView">
            <div class="ntc-header">
                <h2 class="ntc-title">공지사항</h2>
            </div>

            <table class="ntc-table">
                <thead>
                <tr>
                    <th style="width:70px">번호</th>
                    <th>제목</th>
                    <th style="width:100px">작성자</th>
                    <th style="width:90px">조회</th>
                    <th style="width:110px">작성일</th>
                </tr>
                </thead>
                <tbody id="noticeBody">
                </tbody>
            </table>

            <div class="ntc-list-footer">
                <div class="ntc-paging" id="paging"></div>
                <button id="writeBtn" class="btn primary ntc-write-btn hidden" type="button">글쓰기</button>
            </div>
        </div>

        <!-- ============ 상세 화면 ============ -->
        <div id="detailView" class="hidden">
            <div class="ntc-detail">
                <h2 class="ntc-detail-title" id="detailTitle"></h2>
                <div class="ntc-detail-meta">
                    <span id="detailWriter"></span>
                    <span id="detailDate"></span>
                    <span>조회 <strong id="detailViews"></strong></span>
                </div>
                <div class="ntc-detail-content" id="detailContent"></div>
            </div>
            <div class="ntc-detail-actions">
                <button id="backToListBtn" class="btn secondary" type="button">목록으로</button>
                <button id="editBtn" class="btn primary hidden" type="button">수정</button>
                <button id="deleteBtn" class="btn danger hidden" type="button">삭제</button>
            </div>
        </div>

        <!-- ============ 작성 화면 ============ -->
        <div id="writeView" class="hidden">
            <div class="ntc-write-card">
                <h2 class="ntc-title" id="writeViewTitle">공지사항 작성</h2>

                <div class="ntc-write-field">
                    <label class="ntc-write-label" for="ntcTitleInput">제목</label>
                    <input id="ntcTitleInput" class="input" type="text" placeholder="제목을 입력하세요" autocomplete="off">
                </div>

                <div class="ntc-write-field">
                    <label class="ntc-write-label">
                        <input id="ntcPinInput" type="checkbox"> 상단 고정
                    </label>
                </div>

                <div class="ntc-write-field">
                    <label class="ntc-write-label">내용</label>
                    <div id="editor"></div>
                </div>

                <div class="ntc-write-actions">
                    <button id="cancelWriteBtn" class="btn secondary" type="button">취소</button>
                    <button id="submitWriteBtn" class="btn primary" type="button">등록</button>
                </div>
            </div>
        </div>

    </div>

</section>

<th:block layout:fragment="script">
    <script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
    <script th:src="@{/js/common/utils.js}"></script>
    <script th:src="@{/js/client/community/notice.js}"></script>
</th:block>
</body>
</html>
