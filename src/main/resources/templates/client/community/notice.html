<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base}">

<head>
    <meta charset="utf-8">
    <title>공지사항</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/community/notice.css}">
</head>

<body>
<section class="main" layout:fragment="content">

    <div class="notice-page">

        <!-- ============ 목록 화면 ============ -->
        <div id="listView">
            <div class="ntc-header">
                <h2 class="ntc-title">공지사항</h2>
            </div>

            <table class="ntc-table">
                <thead>
                <tr>
                    <th style="width:50px">번호</th>
                    <th>제목</th>
                    <th style="width:100px">작성자</th>
                    <th style="width:90px">조회</th>
                    <th style="width:110px">작성일</th>
                </tr>
                </thead>
                <tbody id="noticeBody">
                <!-- JS에서 렌더링 -->
                </tbody>
            </table>

            <div class="ntc-paging" id="paging">
                <!-- JS에서 렌더링 -->
            </div>
        </div>

        <!-- ============ 상세 화면 ============ -->
        <div id="detailView" class="hidden">
            <div class="ntc-detail">
                <h2 class="ntc-detail-title" id="detailTitle"></h2>
                <div class="ntc-detail-meta">
                    <span id="detailWriter"></span>
                    <span id="detailDate"></span>
                    <span>조회 <strong id="detailViews"></strong></span>
                </div>
                <div class="ntc-detail-content" id="detailContent"></div>
            </div>
            <div class="ntc-detail-actions">
                <button id="backToListBtn" class="btn secondary" type="button">목록으로</button>
            </div>
        </div>

    </div>

</section>

<th:block layout:fragment="script">
    <script th:src="@{/js/common/utils.js}"></script>
    <script th:src="@{/js/client/community/notice.js}"></script>
</th:block>
</body>
</html>
