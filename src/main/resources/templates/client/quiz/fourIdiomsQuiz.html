<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base}">

<head>
    <meta charset="utf-8">
    <title>퀴즈</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/quiz/quiz-common.css}">

</head>

<body>
<section class="main" layout:fragment="content">

    <div class="stage" id="introStage">
        <div class="intro-stack">

            <div id="intro" class="card card--intro">
                <div class="intro-title">
                    문제에서 설명하는 <strong>사자성어</strong>를<br/>
                    <strong>단답으로 입력</strong>하세요
                </div>

                <div class="intro-options">
                    <div class="option-box">
                        <label for="difficulty" class="option-label">난이도</label>
                        <select id="difficulty" class="option-select">
                            <option value="EASY">쉬움</option>
                            <option value="NORMAL" selected>보통</option>
                            <option value="HARD">어려움</option>
                        </select>
                    </div>

                    <div class="option-box">
                        <label for="roundCount" class="option-label">라운드</label>
                        <select id="roundCount" class="option-select">
                            <option value="5">5문제</option>
                            <option value="10" selected>10문제</option>
                            <option value="30">15문제</option>
                            <option value="20">20문제</option>
                        </select>
                    </div>
                </div>

                <div class="intro-actions">
                    <button id="startBtn" class="btn primary" type="button">시작</button>
                </div>
            </div>

            <div class="card card--ranking">
                <div class="ranking-header">
                    <h3 class="ranking-title">🏆 랭킹</h3>
                </div>

                <div class="ranking-list">
                    <div class="rank-row">
                        <span class="rank-no">1</span>
                        <span class="rank-name">mjjeon</span>
                        <span class="rank-score">10점</span>
                    </div>
                    <div class="rank-row">
                        <span class="rank-no">2</span>
                        <span class="rank-name">user02</span>
                        <span class="rank-score">9점</span>
                    </div>
                    <div class="rank-row">
                        <span class="rank-no">3</span>
                        <span class="rank-name">user03</span>
                        <span class="rank-score">8점</span>
                    </div>
                </div>
            </div>

        </div>
    </div>

</section>

<th:block layout:fragment="script">
    <script th:src="@{/js/common/utils.js}"></script>
    <script th:src="@{/js/client/quiz/fourIdiomsQuiz.js}"></script>
</th:block>
</body>
</html>
