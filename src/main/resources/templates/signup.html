<!-- templates/signup.html -->
<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>회원가입</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="wrap">
    <div class="card">

        <div class="brand">
            <img id="logo" th:src="@{/img/horizontal_logo.png}" alt="logo" style="display:block;"/>
        </div>

        <h2 style="margin:0 0 4px; font-size:22px">회원가입</h2>


        <div class="field">
            <label class="label" for="su-name">이름</label>
            <input class="input" id="su-name" name="name" type="name" placeholder="홍길동" />
        </div>

        <div class="field">
            <label class="label" for="su-email">이메일</label>
            <input class="input" id="su-email" name="email" type="email" placeholder="you@example.com" />
        </div>

        <div class="row">
            <div class="field">
                <label class="label" for="su-password">비밀번호</label>
                <input class="input" id="su-password" name="password" type="password" placeholder="비밀번호" required minlength="8" />
            </div>
            <div class="field">
                <label class="label" for="su-password2">비밀번호 확인</label>
                <input class="input" id="su-password2" name="passwordConfirm" type="password" placeholder="비밀번호 확인" required minlength="8" />
            </div>
        </div>
        <p class="hint">비밀번호는 대문자, 소문자, 숫자가 모두 포함된 8자리 이상의 문자열이어야 합니다.</p>


        <div id="pwMsg" class="msg" aria-live="polite"></div>

        <div class="actions">
            <button class="btn" id="signupSubmit" type="button" disabled>가입하기</button>
            <a class="btn secondary" id="back" role="button">로그인으로 돌아가기</a>
        </div>
    </div>
</div>

<script th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
<script th:src="@{/js/common/signup.js}"></script>
<meta name="_csrf" th:content="${_csrf.token}">
<meta name="_csrf_header" th:content="${_csrf.headerName}">
<script>
    const token  = document.querySelector('meta[name="_csrf"]').content;
    const header = document.querySelector('meta[name="_csrf_header"]').content;
    $.ajaxSetup({ beforeSend: (xhr) => xhr.setRequestHeader(header, token) });
</script>

</body>
</html>
