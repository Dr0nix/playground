spring:
  datasource:
    url: ${DB_NEON_URL}
    username: ${DB_NEON_USERNAME}
    password: ${DB_NEON_PASSWORD}
    driver-class-name: org.postgresql.Driver

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
    disable-swagger-default-url: true